name: Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history"
        default: "90"
      top_n:
        description: "Number of coins"
        default: "50"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run backtest
        run: python backtest.py
        env:
          DAYS: ${{ inputs.days }}
          TOP_N: ${{ inputs.top_n }}

      - name: Save trades file
        uses: actions/upload-artifact@v4
        with:
          name: backtest-trades
          path: trades.csv
          if-no-files-found: ignore
